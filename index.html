<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Should I Evolve This Pokémon?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Should I Evolve This Pokémon?</h1>
      <p>Select a Pokémon from your database to see if it can and should be evolved!</p>
    </header>

    <main>
      <section class="search-section">
        <label for="pokemon-select">Choose a Pokémon:</label>
        <select id="pokemon-select" disabled>
          <option value="">Loading Pokémon data...</option>
        </select>
      </section>

      <section id="result-card" class="result-card hidden">
        <div class="pokemon-header">
          <img id="pokemon-image" src="" alt="Pokémon Sprite" />
          <div>
            <h2 id="pokemon-name"></h2>
            <p id="pokemon-types" class="types"></p>
          </div>
        </div>

        <div id="verdict-box" class="verdict-box">
          <h3 id="verdict-title"></h3>
          <p id="verdict-description"></p>
        </div>

        <div class="stats-container">
          <h3>Base Stats (BST: <span id="stat-bst"></span>)</h3>
          <div class="stat-grid">
            <div class="stat-item"><span>HP:</span> <strong id="stat-hp"></strong></div>
            <div class="stat-item"><span>Attack:</span> <strong id="stat-atk"></strong></div>
            <div class="stat-item"><span>Defense:</span> <strong id="stat-def"></strong></div>
            <div class="stat-item"><span>Sp. Atk:</span> <strong id="stat-spatk"></strong></div>
            <div class="stat-item"><span>Sp. Def:</span> <strong id="stat-spdef"></strong></div>
            <div class="stat-item"><span>Speed:</span> <strong id="stat-spd"></strong></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let pokemonMap = new Map();

    document.addEventListener("DOMContentLoaded", () => {
      fetch("pokemon.csv")
        .then(res => {
          if (!res.ok) throw new Error("Could not load pokemon.csv");
          return res.text();
        })
        .then(csvText => {
          parseCSV(csvText);
          populateDropdown();
        })
        .catch(err => {
          console.error(err);
          document.getElementById("pokemon-select").innerHTML = '<option value="">Error loading data</option>';
        });
    });

    function parseCSV(text) {
      const lines = text.split("\n");
      if (lines.length < 2) return;

      const headers = lines[0].split(",").map(h => h.trim());

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const values = line.split(",");
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = values[idx] ? values[idx].trim() : "";
        });

        const id = parseInt(row.id, 10);
        const name = row.pokemon;
        if (isNaN(id) || !name) continue;

        const hp = parseInt(row.hp, 10) || 0;
        const attack = parseInt(row.attack, 10) || 0;
        const defense = parseInt(row.defense, 10) || 0;
        const spAtk = parseInt(row.special_attack, 10) || 0;
        const spDef = parseInt(row.special_defense, 10) || 0;
        const speed = parseInt(row.speed, 10) || 0;

        pokemonMap.set(id, {
          id: id,
          name: name,
          speciesId: parseInt(row.species_id, 10) || id,
          type1: row.type_1 || '',
          type2: row.type_2 && row.type_2 !== 'NA' ? row.type_2 : null,
          hp: hp,
          attack: attack,
          defense: defense,
          spAtk: spAtk,
          spDef: spDef,
          speed: speed,
          bst: hp + attack + defense + spAtk + spDef + speed,
          evolvesFromSpeciesId: row.evolves_from_species_id && row.evolves_from_species_id !== 'NA' 
            ? parseInt(row.evolves_from_species_id, 10) 
            : null
        });
      }
    }

    function populateDropdown() {
      const select = document.getElementById("pokemon-select");
      select.innerHTML = '<option value="">-- Select a Pokémon --</option>';

      const sortedList = Array.from(pokemonMap.values()).sort((a, b) => a.id - b.id);

      sortedList.forEach(poke => {
        const opt = document.createElement("option");
        opt.value = poke.id;
        opt.textContent = `#${poke.id} - ${capitalize(poke.name)}`;
        select.appendChild(opt);
      });

      select.disabled = false;
      select.onchange = (e) => {
        const selectedId = parseInt(e.target.value, 10);
        if (!isNaN(selectedId)) {
          displayDecision(selectedId);
        } else {
          document.getElementById("result-card").classList.add("hidden");
        }
      };
    }

    function displayDecision(id) {
      const current = pokemonMap.get(id);
      if (!current) return;

      const card = document.getElementById("result-card");
      const verdictBox = document.getElementById("verdict-box");
      const verdictTitle = document.getElementById("verdict-title");
      const verdictDesc = document.getElementById("verdict-description");

      document.getElementById("pokemon-image").src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${current.id}.png`;
      document.getElementById("pokemon-name").textContent = `#${current.id} ${capitalize(current.name)}`;
      document.getElementById("pokemon-types").textContent = current.type2 
        ? `Type: ${capitalize(current.type1)} / ${capitalize(current.type2)}`
        : `Type: ${capitalize(current.type1)}`;

      document.getElementById("stat-bst").textContent = current.bst;
      document.getElementById("stat-hp").textContent = current.hp;
      document.getElementById("stat-atk").textContent = current.attack;
      document.getElementById("stat-def").textContent = current.defense;
      document.getElementById("stat-spatk").textContent = current.spAtk;
      document.getElementById("stat-spdef").textContent = current.spDef;
      document.getElementById("stat-spd").textContent = current.speed;

      // Find if any Pokemon evolves from this current species
      const nextStage = Array.from(pokemonMap.values()).find(p => p.evolvesFromSpeciesId === current.speciesId);

      if (nextStage) {
        const diff = nextStage.bst - current.bst;
        verdictBox.className = "verdict-box yes";
        verdictTitle.textContent = `YES! Evolve into ${capitalize(nextStage.name)}`;
        verdictDesc.textContent = `${capitalize(current.name)} can evolve! Evolving will boost Base Stat Total by +${diff} points (from ${current.bst} to ${nextStage.bst}).`;
      } else {
        verdictBox.className = "verdict-box no";
        verdictTitle.textContent = "NO! Do Not Evolve";
        verdictDesc.textContent = `${capitalize(current.name)} is already at its final evolution stage or does not evolve further. Save your candies!`;
      }

      card.classList.remove("hidden");
    }

    function capitalize(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
    }
  </script>
</body>
</html>
